services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRAPPE_BRANCH: version-15
    image: evrp-app:latest
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
    networks:
      - coolify-infra
      - app-net
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: evrp-app:latest
    deploy:
      restart_policy:
        condition: on-failure
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  frontend:
    image: evrp-app:latest
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    networks:
      - coolify-infra
      - app-net
    labels:
      - "coolify.managed=true"
      - "coolify.proxy=true"
      - "traefik.enable=true"
      - "traefik.http.routers.evrp-http.entrypoints=http"
      - "traefik.http.routers.evrp-http.rule=HostRegexp(`^.+\\.evrp\\.cloud$`) || HostRegexp(`^.+\\.[a-z0-9-]+\\.[a-z]+$`)"
      - "traefik.http.routers.evrp-http.middlewares=redirect-to-https"
      - "traefik.http.routers.evrp-https.entrypoints=https"
      - "traefik.http.routers.evrp-https.rule=HostRegexp(`^.+\\.evrp\\.cloud$`) || HostRegexp(`^.+\\.[a-z0-9-]+\\.[a-z]+$`)"
      - "traefik.http.routers.evrp-https.tls=true"
      - "traefik.http.routers.evrp-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.evrp-https.service=evrp-frontend-service"
      - "traefik.http.services.evrp-frontend-service.loadbalancer.server.port=8080"
    depends_on:
      - backend
      - websocket

  websocket:
    image: evrp-app:latest
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    networks:
      - app-net
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: evrp-app:latest
    command: bench worker --queue short,default
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    networks:
      - app-net
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    image: evrp-app:latest
    command: bench worker --queue long,default,short
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    networks:
      - app-net
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    image: evrp-app:latest
    command: bench schedule
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    networks:
      - app-net
    depends_on:
      configurator:
        condition: service_completed_successfully

  banking-worker:
    image: evrp-app:latest
    command: bench worker --queue banking_sync
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      - WORKER_CONCURRENCY=1
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    networks:
      - app-net
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-net

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped
    networks:
      - app-net

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    networks:
      - app-net

volumes:
  sites-vol:
    external: true
  db-data:
  redis-queue-data:

networks:
  coolify-infra:
    external: true
  app-net:
    driver: bridge
